<!--
  Componente: Formulário de contato
  Todo campo tem <label> associado via for/id — nunca placeholder como único
  rótulo. Campos obrigatórios usam required + .form-field--required (marca
  visual "*") e aria-describedby aponta para uma dica quando existe.
  Requer: styles.css (.contact-form, .form-field)

  O atributo action="" está vazio de propósito — aponte para seu endpoint
  de envio (ex.: Formspree, backend próprio) antes de publicar.
-->
<form class="contact-form" action="" method="post">
  <div class="form-field form-field--required">
    <label for="contact-name">Nome</label>
    <input type="text" id="contact-name" name="name" autocomplete="name" required />
  </div>

  <div class="form-field form-field--required">
    <label for="contact-email">E-mail</label>
    <input type="email" id="contact-email" name="email" autocomplete="email" required aria-describedby="contact-email-hint" />
    <p class="form-hint" id="contact-email-hint">Uso só para responder você, nada de spam.</p>
  </div>

  <div class="form-field form-field--required">
    <label for="contact-message">Mensagem</label>
    <textarea id="contact-message" name="message" required></textarea>
  </div>

  <button class="btn btn--accent" type="submit">Enviar mensagem</button>
</form>
