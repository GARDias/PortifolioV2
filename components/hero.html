<!--
  Componente: Hero (título + lead + CTA)
  Uso: primeira seção dentro de <main>. Contém o único <h1> da página.
  Requer: styles.css (.hero, .lead, .btn, .btn--primary, .btn--outline)
-->
<section class="hero" aria-labelledby="hero-title">
  <div class="container">
    <p class="eyebrow hero__eyebrow">Design &amp; desenvolvimento</p>
    <h1 id="hero-title" class="hero__title">Gabriel Dias faz interfaces que funcionam de verdade.</h1>
    <p class="lead">
      28 anos, projetando e construindo produtos digitais do rascunho ao código.
      Menos ruído visual, mais decisão clara — para pessoas e para quem lê o site depois.
    </p>
    <div class="hero__cta">
      <a class="btn btn--primary" href="#projetos">Ver projetos</a>
      <a class="btn btn--outline" href="#contato">Falar comigo</a>
    </div>
  </div>
</section>
