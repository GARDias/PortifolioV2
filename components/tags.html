<!--
  Componente: Tags / badges
  Variantes: neutra (padrão), accent (terracota), ocre.
  Use em lista <ul class="tag-list"> quando representar um conjunto (ex.: tecnologias).
  Requer: styles.css (.tag e modificadores, .tag-list)
-->
<ul class="tag-list">
  <li><span class="tag">Neutra</span></li>
  <li><span class="tag tag--accent">Accent</span></li>
  <li><span class="tag tag--ocre">Ocre</span></li>
</ul>
